services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml_project:dev
    container_name: ml_project_jupyter
    working_dir: /app
    stdin_open: true
    tty: true
    ports:
      - "8888:8888"
    environment:
      PYTHONPATH: /app
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
    volumes:
      - .:/app
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --notebook-dir=/app/notebooks
